[project]
name = "GENIE"
version = "0.1.0"
description = "GENIE Report Generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.1",
    "anyio==4.11.0",
    "boto3>=1.40.68",
    "beautifulsoup4>=4.15.0",
    "celery[redis]>=5.5.3",
    "cryptography>=48.0.1",
    "dirtyjson>=1.0.8",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.121.0",
    "filetype==1.2.0",
    "httpx>=0.28.1",
    "idna>=3.15",
    "jinja2>=3.1.6",
    # lxml is implicit dependency for beautifulsoup4 html parser https://www.crummy.com/software/BeautifulSoup/bs4/doc/#installing-a-parser
    # lxml is also an explict dep for python3-saml which we will need regardless, so adding it here doesn't install any new deps
    "lxml==6.0.2",
    "markdownify>=1.2.3",
    "numpy>=2.3.4",
    "openpyxl>=3.1.5",
    "pdf2docx==0.5.8",
    "pillow>=12.2.0",
    "pydantic>=2.12.4",
    "pymongo[aws]>=4.15.3",
    "pymupdf==1.26.4",
    "pypandoc-binary>=1.15",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart==0.0.32", # required for File() and Form() in fastapi
    "python3-saml==1.16.0",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
    "uvicorn>=0.38.0",
    "openai==2.54.0",
    "prometheus-client==0.26.0",
]

[tool.uv]
constraint-dependencies = []
override-dependencies = []

[dependency-groups]
dev = ["pytest==9.0.3", "pytest-asyncio>=1.3.0"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
