[project]
name = "backend-ai-python"
version = "0.1.0"
description = "Code repository for training and deploying a text classifier."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "boto3==1.42.96",
    "dotenv>=0.9.9",
    "dspy==3.1.3",
    "joblib==1.5.3",
    "litellm==1.83.13",
    "openai==2.24.0",
    "nltk==3.9.4",
    "numpy==2.4.4",
    "pandas==2.3.3",
    "psycopg2-binary==2.9.12",
    "pydantic==2.12.5",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.3",
    "scikit-learn==1.8.0",
    "torch==2.11.0",
    "transformers==5.6.2",
    "google-re2>=1.1.20251105",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ruff==0.15.11",
    "pytest==9.0.3",
    "pre-commit>=4.6.0",
    "pytest-cov>=7.1.0",
]
training = [
    "matplotlib==3.10.8",
    "mlflow[auth]==3.13.0", # TODO: To confirm if dspy models can be loaded without mlflow
    "seaborn==0.13.2",
    "optuna==4.8.0"
]
inference = [
    "celery==5.6.3",
]

[tool.uv]
default-groups = ["dev", "training", "inference"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
